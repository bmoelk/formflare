name = "formflare"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[assets]
directory = "public"
binding = "ASSETS"

# Public Non-Sensitive Configuration Defaults
# ZERO secrets, private email addresses, or custom domain routes should be stored here!
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "*"

# Rate Limiting Configuration
RATE_LIMIT_ENABLED = "false"
RATE_LIMIT_REQUESTS = "10"
RATE_LIMIT_WINDOW = "60"

# Default Email Provider (options: none, console, resend, sendgrid, mailgun, mailtrap)
EMAIL_PROVIDER = "none"

# Infrastructure Bindings (Placeholders only - bound via Cloudflare Dashboard or wrangler.local.toml)
# [[kv_namespaces]]
# binding = "FORM_SUBMISSIONS"
# id = "YOUR_KV_NAMESPACE_ID"

# [[d1_databases]]
# binding = "DB"
# database_name = "formflare-db"
# database_id = "YOUR_DATABASE_ID"

# Production Secrets (Set via: npx wrangler secret put SECRET_NAME)
# - TURNSTILE_SECRET_KEY (Required)
# - API_KEY (Required for GET /submissions)
# - EMAIL_API_KEY (Required if EMAIL_PROVIDER != "none" or "console")
# - EMAIL_FROM (Required if EMAIL_PROVIDER != "none" or "console")
# - EMAIL_TO (Required if EMAIL_PROVIDER != "none" or "console")
# - WEBHOOK_URL (Optional webhook trigger)
