<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="fGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="fGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="fGrad3" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" />

  <!-- Outer Glow Aura -->
  <path d="M 230 100 L 370 100 L 330 180 L 250 180 L 320 250 L 250 280 L 250 400 L 180 400 L 180 180 Z" 
        fill="url(#fGrad1)" opacity="0.3" filter="url(#glow)" />

  <!-- Geometric Sculpted F - Top Bar -->
  <polygon points="210,110 390,110 340,185 245,185" fill="url(#fGrad1)" />

  <!-- Geometric Sculpted F - Middle Bevel Bar -->
  <polygon points="230,230 345,230 305,290 230,290" fill="url(#fGrad3)" />

  <!-- Geometric Sculpted F - Spine & Fluid Facet -->
  <path d="M 210 110 L 245 185 L 230 290 L 230 395 L 175 370 L 175 160 Z" fill="url(#fGrad2)" />
  
  <!-- Subtle Origami Facet Shading -->
  <polygon points="175,160 210,110 245,185" fill="#ffffff" opacity="0.15" />
  <polygon points="230,230 245,185 340,185" fill="#000000" opacity="0.2" />
</svg>
